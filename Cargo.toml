[package]
name = "stackmap"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "A fast local-first Graphite stack map for the terminal"
license = "MIT"
repository = "https://github.com/fieldsofland/stackmap"
readme = "README.md"
keywords = ["git", "graphite", "terminal", "tui", "branches"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/tests/**",
    "/benches/**",
]
autobenches = false

[features]
benchmarking = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"

[[bench]]
name = "responsiveness"
harness = false
required-features = ["benchmarking"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
